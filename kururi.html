const NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id), board=$('board');
const SAVE_KEY='touch_lab_kururi_v03',state={idx:0,p:[],moves:0,history:[],sound:true,best:{},hint:null,locked:false,won:false,epoch:0};
try{const old=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');if(old&&old.best&&typeof old.best==='object')state.best=old.best;if(typeof old.sound==='boolean')state.sound=old.sound;}catch(e){}

let ctx=null;function aud(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}
function tone(freq,dur,delay=0,vol=.045){if(!state.sound||!ctx)return;const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.007);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.012)}

const svg=(tag,attr,parent=board)=>{const el=document.createElementNS(NS,tag);Object.entries(attr).forEach(([k,v])=>el.setAttribute(k,v));parent.append(el);return el};
function level(){return LEVELS[state.idx]}
function norm(a,b){return a<b?[a,b]:[b,a]}
function dominoes(p){const out=[];for(let i=0;i<p.length;i++)if(i<p[i])out.push([i,p[i]]);return out}
function flippable(p,w,h){let result=[];for(let y=0;y<h-1;y++)for(let x=0;x<w-1;x++){const a=y*w+x,b=a+1,c=a+w,d=c+1;let horizontal=p[a]===b&&p[c]===d,vertical=p[a]===c&&p[b]===d;if(horizontal||vertical)result.push({x,y,horizontal,ids:[a,b,c,d]})}return result}
function flip(p,f){const q=p.slice(),[a,b,c,d]=f.ids;if(f.horizontal){q[a]=c;q[c]=a;q[b]=d;q[d]=b}else{q[a]=b;q[b]=a;q[c]=d;q[d]=c}return q}
function matches(p,g){return g.reduce((s,[a,b])=>s+(p[a]===b?1:0),0)}

const g=rect('g',{},board);rect('rect',{x:ox-7,y:oy-7,width:W*c+14,height:H*c+14,rx:19,fill:'#E4EFE9',stroke:'#DCEBE2','stroke-width':1},g);

if(animate){const a=rect('g',{transform:`rotate(0 ${animate.cx} ${animate.cy})`},board);for(const [i,j] of animate.pieces)drawTile(i,j,cfg,a);const begin=performance.now(),epoch=state.epoch;const duration=240;state.locked=true;function step(now){if(epoch!==state.epoch)return;let t=Math.min(1,(now-begin)/duration);let e=1-Math.pow(1-t,3);a.setAttribute('transform',`rotate(${animate.angle*e} ${animate.cx} ${animate.cy})`);if(t<1)requestAnimationFrame(step);else{state.p=animate.newP;state.locked=false;draw();afterMove()}}requestAnimationFrame(step)}

if(!animate){let ff=flippable(state.p,W,H);for(const f of ff){const centerX=ox+(f.x+1)*c,centerY=oy+(f.y+1)*c;const hinted=state.hint&&state.hint[0]===f.x&&state.hint[1]===f.y;const button=rect('g',{class:'flip-hit',role:'button','aria-label':`列${f.x+1}行${f.y+1}の2枚を反転`},board);rect('circle',{cx:centerX,cy:centerY,r:Math.max(15,c*.27),fill:hinted?'#F1C87C':'#FFFFFF','fill-opacity':hinted?.97:.89,stroke:hinted?'#DBA353':'#5FAEA6','stroke-width':hinted?2:1.4},button);let t=rect('path',{d:`M ${centerX-7} ${centerY+1} A 8 8 0 1 1 ${centerX+5} ${centerY+6} M ${centerX+5} ${centerY+6} l -4 -1 M ${centerX+5} ${centerY+6} l 1 -4`,fill:'none',stroke:'#358F8D','stroke-width':1.8,'stroke-linecap':'round','stroke-linejoin':'round','pointer-events':'none'},button);rect('circle',{cx:centerX,cy:centerY,r:Math.max(21,c*.41),fill:'transparent','pointer-events':'all'},button);button.addEventListener('pointerdown',e=>{e.preventDefault();if(state.locked||state.won)return;aud();doFlip(f)});}}

}
function afterMove(){const L=level();$('goalCount').textContent=matches(state.p,L.goals)+' / '+L.goals.length;if(matches(state.p,L.goals)===L.goals.length){state.won=true;const old=state.best[state.idx];state.best[state.idx]=old==null?state.moves:Math.min(old,state.moves);save();sound('win');$('winDetail').textContent=`${state.moves}手で完成  ·  最短 ${L.d}手`;$('win').classList.add('visible');$('winNext').textContent=state.idx===LEVELS.length-1?'もう一度遊ぶ →':'次の問題へ →';renderProgress()}else if(matches(state.p,L.goals)>0)sound('good');}

function renderProgress(){const p=$('progress');p.replaceChildren();LEVELS.forEach((_,i)=>{const t=document.createElement('span');t.className=(state.best[i]!=null?'passed ':'')+(i===state.idx?'current':'');p.append(t)});}
function setLevel(i){state.epoch++;state.idx=Math.max(0,Math.min(LEVELS.length-1,i));state.p=level().p.slice();state.moves=0;state.history=[];state.hint=null;state.won=false;state.locked=false;$('win').classList.remove('visible');$('level').textContent=String(state.idx+1).padStart(2,'0')+' / '+LEVELS.length;$('goalCount').textContent='0 / '+level().goals.length;$('stageNote').textContent=state.idx<2?'丸い矢印をタップ。2枚が90°回る。':state.idx<8?'金の枠を全部そろえよう。':'回す順番を考えてみよう。';$('prev').disabled=state.idx===0;$('next').disabled=state.idx===LEVELS.length-1;renderProgress();draw();}
function seekHint(){if(state.locked||state.won)return;const L=level(),W=L.w,H=L.h,root=state.p.join(','),queue=[state.p],visit=new Set([root]),prev=new Map();let end=null;for(let i=0;i<queue.length;i++){let p=queue[i],key=p.join(',');if(matches(p,L.goals)===L.goals.length){end=key;break}for(const f of flippable(p,W,H)){const q=flip(p,f),k=q.join(',');if(!visit.has(k)){visit.add(k);prev.set(k,{from:key,f});queue.push(q)}}}if(end===null)return;let k=end;while(prev.has(k)){let cur=prev.get(k);if(cur.from===root){state.hint=[cur.f.x,cur.f.y];draw();return}k=cur.from}}
$('prev').onclick=()=>setLevel(state.idx-1);$('next').onclick=()=>setLevel(state.idx+1);$('winNext').onclick=()=>setLevel(state.idx===LEVELS.length-1?0:state.idx+1);$('restart').onclick=()=>setLevel(state.idx);$('undo').onclick=()=>{if(state.locked||!state.history.length)return;state.p=state.history.pop();state.moves=Math.max(0,state.moves-1);state.hint=null;state.won=false;$('win').classList.remove('visible');draw()};$('hint').onclick=()=>seekHint();$('sound').onclick=()=>{aud();state.sound=!state.sound;$('sound').textContent=state.sound?'♫':'♪̸';save();if(state.sound)tone(740,.09)};$('info').onclick=()=>alert('① 2枚が並ぶ場所の丸い矢印をタップ\n② 2枚が90°回転\n③ 金色の枠すべてにドミノが一致したらクリア！\n\nすべての問題は計算で解けることを確認済み。\n「ヒント」を押すと、正解に近づく1手を示します。');
window.KURURI_TEST={LEVELS,state,flippable,flip,matches,setLevel,seekHint};setLevel(0);
})();
