<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],SV='http://www.w3.org/2000/svg';

let winTimer=null;try{const p=JSON.parse(localStorage.getItem('touch-lab-v1')||'{}');for(const m in S.level)if(Number.isInteger(p[m]))S.level[m]=Math.min(4,Math.max(0,p[m]));if(typeof p.sound==='boolean')S.sound=p.sound}catch(e){}

function audio(){if(!S.sound)return null;try{if(!S.audio)S.audio=new (window.AudioContext||window.webkitAudioContext)();if(S.audio.state==='suspended')S.audio.resume();return S.audio}catch(e){return null}}
function sound(kind='click'){const c=audio();if(!c)return;let now=c.currentTime,f=kind==='win'?760:kind==='tap'?490:560,d=kind==='win'?.19:.075;try{const osc=c.createOscillator(),gain=c.createGain(),filter=c.createBiquadFilter();osc.type='sine';filter.type='lowpass';filter.frequency.value=2000;osc.frequency.setValueAtTime(f,now);osc.frequency.exponentialRampToValueAtTime(f*(kind==='win'?1.2:.86),now+d);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(kind==='win'?.055:.029,now+.007);gain.gain.exponentialRampToValueAtTime(.0001,now+d);osc.connect(filter);filter.connect(gain);gain.connect(c.destination);osc.start(now);osc.stop(now+d+.02);if(kind==='win'){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*1.5;g.gain.setValueAtTime(.0001,now+.055);g.gain.exponentialRampToValueAtTime(.028,now+.08);g.gain.exponentialRampToValueAtTime(.0001,now+.29);o.connect(g);g.connect(c.destination);o.start(now+.055);o.stop(now+.31)}}catch(e){}}

function el(t,c='',parent=null){const n=document.createElement(t);if(c)n.className=c;if(parent)parent.appendChild(n);return n}

function mod(a){return (a%360+360)%360}function angleDiff(a,b){return ((a-b+540)%360)-180}function theta(x,y){return Math.atan2(y,x)*180/Math.PI}
function setMode(mode){if(!metadata[mode])return;S.mode=mode;$$('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));render()}
function setLevel(i){if(i<0||i>4)return;S.level[S.mode]=i;persist();render()}
function render(){if(winTimer){clearTimeout(winTimer);winTimer=null}S.won=false;S.boundPointer=null;$('#winCard').classList.remove('show');$('#arena').innerHTML='';const md=metadata[S.mode],lvl=S.level[S.mode];$('#gameTitle').textContent=md.title;$('#gameDesc').textContent=md.desc;$('#levelText').textContent=String(lvl+1).padStart(2,'0')+' / 05';$('#stageLabel').textContent=md.label;$('#microHint').textContent=md.note;$('#footerNote').textContent='';$('#prev').disabled=lvl===0;$('#next').disabled=lvl===4;$('#outroNote').textContent='3つの触り心地をくらべよう';$('#winText').textContent=S.mode==='hinge'?'形が重なった':S.mode==='border'?'輪郭が整った':'模様がそろった';$('#winNext').textContent=lvl===4?'もう一度':'次へ →';$('#progress').replaceChildren(...Array.from({length:5},(_,i)=>{const s=el('span');s.className=i<lvl?'done':i===lvl?'current':'';return s}));if(S.mode==='domino')renderDomino();if(S.mode==='hinge')renderHinge();if(S.mode==='border')renderBorder()}

// DOMINO -- exact tiling graph, no arbitrary permutations
const flipLevels=[{r:2,c:2,d:1,sel:0},{r:2,c:4,d:2,sel:0},{r:4,c:4,d:2,sel:2},{r:4,c:4,d:3,sel:4},{r:4,c:4,d:5,sel:8}];
function uniformTiling(r,c){const p=Array(r*c).fill(-1);for(let y=0;y<r;y++)for(let x=0;x<c;x+=2){let a=y*c+x,b=a+1;p[a]=b;p[b]=a}return p}

function pairs(p){const a=[];for(let i=0;i<p.length;i++)if(i<p[i])a.push([i,p[i]]);return a}
function rectForPair(a,b,c,cell,gap){let x=a%c,y=Math.floor(a/c),xx=b%c,yy=Math.floor(b/c);return {left:gap+x*cell+1.7,top:gap+y*cell+1.7,width:(Math.abs(xx-x)+1)*cell-3.4,height:(Math.abs(yy-y)+1)*cell-3.4}}
function drawTiling(board,p,r,c,cell,gap,mini=false){board.innerHTML='';board.style.width=(c*cell+gap*2)+'px';board.style.height=(r*cell+gap*2)+'px';let grid=el('div','flip-cell-grid',board);for(let y=0;y<r;y++)for(let x=0;x<c;x++){let d=el('div','flip-grid-cell',grid);Object.assign(d.style,{left:(gap+x*cell)+'px',top:(gap+y*cell)+'px',width:cell+'px',height:cell+'px'})}for(const [a,b] of pairs(p)){const piece=el('div','domino-piece'+(mini?' mini':'')+(Math.floor(a/c)%2===0?'':' alt'),board);const rect=rectForPair(a,b,c,cell,gap);Object.assign(piece.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px'});piece.dataset.id=String(a)}}

function paint(){const p=hingePoints(o.angles,def.len,def.anchor);o.points=p;for(let i=0;i<o.bars.length;i++)limbTransform(o.bars[i],p[i],p[i+1],30);for(let i=0;i<o.knobs.length;i++)o.knobs[i].setAttribute('transform',`translate(${p[i].x},${p[i].y})`)}paint();function loc(e){const r=board.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*350,y:(e.clientY-r.top)/r.height*350}}

// BORDER -- cell movement and traced perimeter
const borderLevels=[{n:4,pts:[[0,1],[1,1],[2,1],[3,1]],goal:8},{n:5,pts:[[0,1],[1,1],[2,1],[3,1],[4,1]],goal:10},{n:6,pts:[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1]],goal:10},{n:7,pts:[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[5,2]],goal:12},{n:8,pts:[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[5,2],[4,2]],goal:12}];
function perimeter(pts){const set=new Set(pts.map(([x,y])=>`${x},${y}`));let p=0;for(const [x,y] of pts)for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])if(!set.has(`${x+dx},${y+dy}`))p++;return p}
function borderLoops(pts,cell){const set=new Set(pts.map(([x,y])=>`${x},${y}`)),s=[];for(const [x,y] of pts){if(!set.has(`${x},${y-1}`))s.push(`M${x*cell} ${y*cell}h${cell}`);if(!set.has(`${x+1},${y}`))s.push(`M${(x+1)*cell} ${y*cell}v${cell}`);if(!set.has(`${x},${y+1}`))s.push(`M${(x+1)*cell} ${(y+1)*cell}h-${cell}`);if(!set.has(`${x-1},${y}`))s.push(`M${x*cell} ${(y+1)*cell}v-${cell}`)}return s.join(' ')}

const cell=Math.floor(Math.min((arena.clientWidth-32)/6,(arena.clientHeight-104)/6,49)),size=6*cell;const board=el('div','border-board',arena);Object.assign(board.style,{width:size+'px',height:size+'px',top:'calc(52% + 11px)'});o.cell=cell;o.board=board;const g=el('div','border-grid',board);for(let y=0;y<6;y++)for(let x=0;x<6;x++){const c=el('div','border-grid-cell',g);Object.assign(c.style,{left:x*cell+'px',top:y*cell+'px',width:cell+'px',height:cell+'px'})}const lines=svg('svg',{class:'border-outline',viewBox:`0 0 ${size} ${size}`,width:size,height:size},board);o.edge=svg('path',{class:'border-edge'},lines);o.pieces=[];for(let i=0;i<def.n;i++){const d=el('div','border-piece',board);d.dataset.i=i;d.style.width=(cell-4)+'px';d.style.height=(cell-4)+'px';o.pieces.push(d)}function update(){for(let i=0;i<def.n;i++){if(o.drag?.i===i)continue;const [x,y]=o.pts[i];o.pieces[i].style.left=(x*cell+2)+'px';o.pieces[i].style.top=(y*cell+2)+'px'}o.edge.setAttribute('d',borderLoops(o.pts,cell));const p=perimeter(o.pts);o.meterNum.textContent=String(p);o.meter.style.width=(Math.max(.1,Math.min(1,def.goal/p))*100)+'%';if(p<=def.goal&&connected(o.pts))won()}update();
