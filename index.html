#248e89}.bottom button:disabled{opacity:.3}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f8fdf8a6;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}.overlay.show{opacity:1;pointer-events:auto}.finish{width:min(85%,265px);background:#fffffff5;border:1px solid #d6e9df;box-shadow:0 15px 32px #4a857129;border-radius:24px;padding:24px 17px;text-align:center}.finish-emblem{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e1f3eb;color:#188e83;margin:0 auto 11px;font-size:22px}.finish strong{font-size:18px}.finish p{color:#839d94;font-size:12px;margin:6px 0 16px}.finish button{border:0;background:#218e88;color:#fff;font-size:13px;border-radius:12px;font-weight:800;padding:12px 18px}.finish button.aux{background:#f2f7f4;color:#688a81;margin-right:5px}.foot{text-align:center;color:#a1b3ac;font-size:10px;padding:8px 0 12px;letter-spacing:.04em}.clickable{cursor:pointer}.hinge-handle{cursor:grab;touch-action:none}.hinge-handle:active{cursor:grabbing}.goalring{animation:breath 2.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes breath{0%,100%{opacity:.65}50%{opacity:1}}.domino-bar{filter:drop-shadow(0 2px 2px #2b7b6e20)}@media(max-width:350px){.app{padding-left:10px;padding-right:10px}.subtitle h1{font-size:21px}.card{padding:9px}.nav b{font-size:12px}.bar{min-height:39px}}

 <section class="subtitle"><div><div class="label" id="eyebrow">TOUCH EXPERIMENT 01</div><h1 id="title">くるり</h1><p id="description">丸い矢印をタップすると、2枚が回る。</p></div><div class="lv" id="level">01 / 05</div></section>

<script>
(()=>{'use strict';
const NS='http://www.w3.org/2000/svg',N=4, board=document.getElementById('board'),arena=document.getElementById('arena'),$=x=>document.getElementById(x), key=(x,y)=>x+','+y;
const MODE={domino:{title:'くるり',desc:'丸い矢印をタップすると、2枚が回る。',bar:'薄い盤面と同じ向きに',note:'丸い矢印がある場所だけ回せる'},hinge:{title:'くねくね',desc:'丸い先端をつかみ、光の輪へ運ぼう。',bar:'先端を輪へ',note:'棒ではなく、丸い先端を直接つかむ'},border:{title:'ぴったり',desc:'金色の点を覆い、輪郭を短く。',bar:'輪郭を短く / 金の点を覆う',note:'完成形の見本はない。自分で形を考える'}};
const S={mode:'domino',level:{domino:0,hinge:0,border:0},cleared:{domino:[],hinge:[],border:[]},won:false,sound:true,engine:null,raf:0,active:null};
try{const saved=JSON.parse(localStorage.getItem('touch_lab_v02')||'{}');if(saved.cleared){for(const m of Object.keys(S.cleared))S.cleared[m]=Array.isArray(saved.cleared[m])?saved.cleared[m]:[]}if(typeof saved.sound==='boolean')S.sound=saved.sound}catch(e){}
const save=()=>{try{localStorage.setItem('touch_lab_v02',JSON.stringify({cleared:S.cleared,sound:S.sound}))}catch(e){}};
let ctx=null;function audioInit(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}
function tone(freq=560,dur=.055,volume=.034,type='sine',delay=0){if(!S.sound||!ctx)return;try{const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function sfx(k){if(k==='tick')tone(540,.05,.026);else if(k==='place')tone(610,.065,.040);else if(k==='bad')tone(340,.07,.024);else if(k==='success'){tone(523.25,.17,.043);tone(659.25,.18,.035,'sine',.095)}}
function haptic(){try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}}
function svg(parent,tag,props={},text){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(props))n.setAttribute(k,v);if(text!==undefined)n.textContent=String(text);(parent||board).append(n);return n}
function clear(){board.replaceChildren();}
function xy(e){const r=board.getBoundingClientRect();return {x:(e.clientX-r.left)*360/r.width,y:(e.clientY-r.top)*360/r.height}}
function near(a,b,eps=1e-5){return Math.abs(a-b)<=eps}
function win(info){if(S.won)return;S.won=true;S.cleared[S.mode]=[...new Set([...S.cleared[S.mode],S.level[S.mode]])];save();sfx('success');haptic();$('winInfo').textContent=info;$('overlay').classList.add('show');updateProgress();}
function updateProgress(){const parent=$('progress');parent.replaceChildren();for(let i=0;i<5;i++){const el=document.createElement('i');el.className=S.cleared[S.mode].includes(i)?'done':i===S.level[S.mode]?'now':'';parent.append(el)}}
function setMode(m){if(!MODE[m])return;S.mode=m;render()}
function setLevel(n){S.level[S.mode]=Math.min(4,Math.max(0,n));render()}
function render(){cancelAnimationFrame(S.raf);S.raf=0;S.active=null;S.won=false;S.engine=null;$('overlay').classList.remove('show');const m=MODE[S.mode],lv=S.level[S.mode];$('title').textContent=m.title;$('description').textContent=m.desc;$('barLabel').textContent=m.bar;$('eyebrow').textContent='TOUCH EXPERIMENT 0'+(Object.keys(MODE).indexOf(S.mode)+1);$('level').textContent=String(lv+1).padStart(2,'0')+' / 05';$('barValue').replaceChildren();$('stageNote').textContent=m.note;$('prev').disabled=lv===0;$('next').disabled=lv===4;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('current',b.dataset.mode===S.mode));updateProgress();board.onpointerdown=null;board.onpointermove=null;board.onpointerup=null;board.onpointercancel=null;clear();if(S.mode==='domino')dominoInit();if(S.mode==='hinge')hingeInit();if(S.mode==='border')borderInit();}
// DOMINO — a legal move is a visible 2×2 rotation of EXACTLY two parallel pieces.
function uniform(n=4){const p=Array(n*n).fill(-1);for(let y=0;y<n;y++)for(let x=0;x<n;x+=2){let a=y*n+x,b=a+1;p[a]=b;p[b]=a}return p}
function canon(p){return p.join(',')}
function flips(p,n=4){const a=[];for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const tl=y*n+x,tr=tl+1,bl=tl+n,br=bl+1;const h=p[tl]===tr&&p[bl]===br,v=p[tl]===bl&&p[tr]===br;if(h||v)a.push({x,y,h,ids:[tl,tr,bl,br]})}return a}
function flip(p,f,n=4){const z=p.slice(),[a,b,c,d]=f.ids;if(f.h){z[a]=c;z[c]=a;z[b]=d;z[d]=b}else{z[a]=b;z[b]=a;z[c]=d;z[d]=c}return z}
function dominoLevels(){const start=uniform(),seen=new Map([[canon(start),{p:start,d:0}]]),q=[start],layer={0:[start]};for(let i=0;i<q.length;i++){const p=q[i],d=seen.get(canon(p)).d;for(const f of flips(p)){const z=flip(p,f),k=canon(z);if(!seen.has(k)){seen.set(k,{p:z,d:d+1});q.push(z);(layer[d+1]??=[]).push(z)}}}return [1,2,3,4,5].map((d,i)=>({start:start.slice(),target:layer[d][[0,1,3,5,9][i]%layer[d].length],distance:d}))}
const DOM=dominoLevels();
function parts(p,n=4){const seen=new Set(),out=[];for(let i=0;i<p.length;i++){if(seen.has(i))continue;const j=p[i];if(j<0)continue;seen.add(i);seen.add(j);const xa=i%n,ya=Math.floor(i/n),xb=j%n,yb=Math.floor(j/n);out.push({cells:[i,j],x:Math.min(xa,xb),y:Math.min(ya,yb),h:ya===yb})}return out}
function drawDominoPiece(parent,p,cx,cy,cell,mini=false){const x=p.x*cell+cx+3,y=p.y*cell+cy+3,w=(p.h?2:1)*cell-6,h=(p.h?1:2)*cell-6;svg(parent,'rect',{x,y,width:w,height:h,rx:mini?4:10,fill:p.h?'#69c5bb':'#e1ad76',stroke:p.h?'#27978e':'#ca8b58','stroke-width':mini?1:1.4,class:'domino-bar'});if(!mini){svg(parent,'line',{x1:x+11,y1:y+11,x2:x+w-11,y2:y+11,stroke:'#ffffffa0','stroke-width':2,'stroke-linecap':'round'});svg(parent,'circle',{cx:x+w/2,cy:y+h/2,r:3.6,fill:'#ffffffa8'})}}
function drawDominoMini(parent,p){const n=4,c=15,x=3,y=3;svg(parent,'rect',{x:1,y:1,width:64,height:64,rx:8,fill:'#eaf2ed'});for(const b of parts(p))drawDominoPiece(parent,b,x,y,c,true)}
function dominoInit(){const def=DOM[S.level.domino],o={p:def.start.slice(),target:def.target,steps:0,busy:false};S.engine=o;const C=71,OX=38,OY=38;const targetSvg=svg($('barValue'),'svg',{viewBox:'0 0 68 68',style:'width:68px;height:68px;border-radius:10px;border:1px solid #dce8e0;background:#f5faf6'});drawDominoMini(targetSvg,def.target);
 function paint(skip=[]){clear();svg(board,'rect',{x:OX-4,y:OY-4,width:C*4+8,height:C*4+8,rx:20,fill:'#e7f0eb'});for(let y=0;y<4;y++)for(let x=0;x<4;x++)svg(board,'rect',{x:OX+x*C,y:OY+y*C,width:C,height:C,fill:'transparent',stroke:'#c8dcd1','stroke-width':.8});for(const b of parts(o.p)){if(b.cells.some(id=>skip.includes(id)))continue;drawDominoPiece(board,b,OX,OY,C)}const fs=flips(o.p);if(!o.busy)for(const f of fs){const cx=OX+(f.x+1)*C,cy=OY+(f.y+1)*C;const circle=svg(board,'circle',{cx,cy,r:18,fill:'#fffdf6e8',stroke:'#6d9b96','stroke-width':1.6,class:'clickable','data-x':f.x,'data-y':f.y});svg(board,'path',{d:`M ${cx-8} ${cy+1} A 9 9 0 1 1 ${cx+4} ${cy+7}`,stroke:'#248f88',fill:'none','stroke-width':2.2,'stroke-linecap':'round','pointer-events':'none'});svg(board,'path',{d:`M${cx+3} ${cy+3} L${cx+8} ${cy+8} L${cx+1} ${cy+9}`,fill:'none',stroke:'#248f88','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round','pointer-events':'none'});circle.addEventListener('pointerdown',e=>{e.preventDefault();if(o.busy||S.won)return;audioInit();doFlip(f)})}svg(board,'text',{x:180,y:348,'text-anchor':'middle',fill:'#8caaa0','font-size':11,'letter-spacing':'.03em'},'中央の丸い矢印だけが回せる場所');$('status').textContent=o.steps+' 回転';}
 function doFlip(f){o.busy=true;sfx('tick');const p=parts(o.p).filter(v=>v.cells.some(id=>f.ids.includes(id)));paint(f.ids);const cx=OX+(f.x+1)*C,cy=OY+(f.y+1)*C,rot=svg(board,'g',{transform:`rotate(0 ${cx} ${cy})`});for(const part of p)drawDominoPiece(rot,part,OX,OY,C);svg(board,'rect',{x:cx-C+2,y:cy-C+2,width:C*2-4,height:C*2-4,rx:15,fill:'none',stroke:'#3aafa4','stroke-width':2,'stroke-dasharray':'5 7','pointer-events':'none'});let start=performance.now();function loop(t){if(S.engine!==o)return;const u=Math.min(1,(t-start)/280),v=1-Math.pow(1-u,3);rot.setAttribute('transform',`rotate(${90*v} ${cx} ${cy})`);if(u<1)S.raf=requestAnimationFrame(loop);else{const old=o.p;o.p=flip(old,f);o.steps++;o.busy=false;sfx('place');haptic();paint();if(canon(o.p)===canon(o.target))win(o.steps+'回でそろえた')}}S.raf=requestAnimationFrame(loop)}paint()}
// HINGE — only the visible end handles are draggable; pivots and links are physically connected.
const HINGE=[
 {root:[146,226],lengths:[108],init:[-12],goal:[-82],checks:[1]},
 {root:[102,240],lengths:[99,93],init:[-55,45],goal:[-5,-86],checks:[2]},
 {root:[122,253],lengths:[100,92],init:[-73,8],goal:[-13,-111],checks:[1,2]},
 {root:[76,259],lengths:[84,82,78],init:[-45,50,-20],goal:[-6,-70,4],checks:[3]},
 {root:[76,261],lengths:[83,84,76],init:[-65,20,63],goal:[-10,-94,4],checks:[2,3]}
 ];
function hingePts(o,angles=o.angles){let out=[{x:o.root[0],y:o.root[1]}];for(let i=0;i<angles.length;i++){const p=out[i],a=angles[i]*Math.PI/180;out.push({x:p.x+o.lengths[i]*Math.cos(a),y:p.y+o.lengths[i]*Math.sin(a)})}return out}
function hingeInit(){const def=HINGE[S.level.hinge],o={...def,angles:def.init.slice(),goalPts:null,drag:null};o.goalPts=hingePts(o,def.goal);S.engine=o;$('barValue').textContent='光の輪 '+def.checks.length+'つ';
 function paint(){clear();const p=hingePts(o);o.points=p;svg(board,'circle',{cx:o.root[0],cy:o.root[1],r:14,fill:'#d5ebe2',stroke:'#8fb9ac','stroke-width':1.3});for(const idx of def.checks){const t=o.goalPts[idx],distance=Math.hypot(t.x-p[idx].x,t.y-p[idx].y);svg(board,'circle',{cx:t.x,cy:t.y,r:19,fill:'#e4f7ed90',stroke:distance<16?'#26a08d':'#87c3af','stroke-width':3,class:'goalring'});svg(board,'circle',{cx:t.x,cy:t.y,r:6.5,fill:'#a4d8c2','fill-opacity':.35})}
 for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1],color=i%2?'#dfab72':'#4eb5b3';svg(board,'line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#276f7180','stroke-width':36,'stroke-linecap':'round'});svg(board,'line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:color,'stroke-width':31,'stroke-linecap':'round'});svg(board,'line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y-0,stroke:'#fff8','stroke-width':2,'stroke-linecap':'round'})}
 p.forEach((q,i)=>{if(i===0){svg(board,'circle',{cx:q.x,cy:q.y,r:9,fill:'#ecf7f0',stroke:'#5b9b8e','stroke-width':2});return}svg(board,'circle',{cx:q.x,cy:q.y,r:15,fill:'#fffaf0',stroke:o.drag?.i===i?'#169d9e':'#4fa49e','stroke-width':3});svg(board,'circle',{cx:q.x,cy:q.y,r:5,fill:i%2?'#d7a66b':'#32b3ae'});const area=svg(board,'circle',{cx:q.x,cy:q.y,r:30,fill:'transparent',class:'hinge-handle','data-index':i});area.addEventListener('pointerdown',e=>{if(S.won)return;e.preventDefault();audioInit();const idx=Number(area.dataset.index),co=xy(e),pivot=p[idx-1],a=Math.atan2(co.y-pivot.y,co.x-pivot.x)*180/Math.PI;o.drag={id:e.pointerId,i:idx,lastClickAngle:a,initial:o.angles[idx-1],lastSoundAngle:a};board.setPointerCapture(e.pointerId);sfx('tick')})});svg(board,'text',{x:180,y:344,fill:'#8ca89d','font-size':11,'text-anchor':'middle'},'丸い先端を引っ張る');}

function perimeter(p){const s=new Set(p.map(([x,y])=>key(x,y)));return p.reduce((sum,[x,y])=>sum+[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>!s.has(key(x+dx,y+dy))).length,0)}
